name: Build and Deploy CineLists

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ooemir23/cinelists

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm test -- --runInBand
      - run: npm run test:migration
      - run: npm run lint
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build
        env:
          DATABASE_URL: postgresql://build:build@127.0.0.1:5432/build

  build-and-push:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        if: github.ref == 'refs/heads/main'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Set build metadata
        id: build_meta
        run: echo "build_date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Build container for smoke test
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: cinelists:smoke
          secrets: |
            server_actions_key=${{ secrets.NEXT_SERVER_ACTIONS_ENCRYPTION_KEY }}
          build-args: |
            APP_COMMIT_SHA=${{ github.sha }}
            APP_BUILD_DATE=${{ steps.build_meta.outputs.build_date }}
            APP_DEPLOYMENT_ID=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify container health
        run: |
          set -eu
          smoke_secret=$(openssl rand -base64 48)
          docker run -d --name cinelists-smoke -e AUTH_SECRET="$smoke_secret" -p 3000:3000 cinelists:smoke
          trap 'docker rm -f cinelists-smoke >/dev/null' EXIT
          healthy=false
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/api/health >/dev/null; then
              healthy=true
              break
            fi
            sleep 2
          done
          test "$healthy" = true

      - name: Build and push Docker image
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          secrets: |
            server_actions_key=${{ secrets.NEXT_SERVER_ACTIONS_ENCRYPTION_KEY }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            APP_COMMIT_SHA=${{ github.sha }}
            APP_BUILD_DATE=${{ steps.build_meta.outputs.build_date }}
            APP_DEPLOYMENT_ID=${{ github.sha }}


      - name: Trigger Dokploy Webhook
        if: github.ref == 'refs/heads/main'
        env:
          DOKPLOY_WEBHOOK_URL: ${{ secrets.DOKPLOY_WEBHOOK_URL }}
        run: |
          if [ -n "$DOKPLOY_WEBHOOK_URL" ]; then
            curl --fail --silent --show-error --max-time 30 -X POST "$DOKPLOY_WEBHOOK_URL" >/dev/null
          else
            echo "DOKPLOY_WEBHOOK_URL is not set, skipping webhook trigger."
          fi

      - name: Verify deployed health
        if: ${{ github.ref == 'refs/heads/main' && vars.DEPLOY_HEALTH_URL != '' }}
        env:
          DEPLOY_HEALTH_URL: ${{ vars.DEPLOY_HEALTH_URL }}
        run: curl --fail --silent --show-error --retry 10 --retry-delay 6 --retry-all-errors --max-time 10 "$DEPLOY_HEALTH_URL" >/dev/null
